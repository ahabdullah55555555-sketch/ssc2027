.sbar input:focus{outline:none}

.swatches{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 16px}
.sw{display:flex;align-items:center;gap:10px;background:var(--soft);border:0;border-radius:14px;min-height:52px;padding:6px 16px 6px 8px;font:inherit;font-size:14.5px;font-weight:500;color:var(--text);cursor:pointer}
.sw i{width:36px;height:36px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.sw.on{background:var(--accsoft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
/* ---- home redesign ---- */
.hgreet{color:var(--muted);font-size:15px}
.hname{font-family:'Outfit','Hind Siliguri','Noto Sans Bengali','Poppins',sans-serif;font-size:32px;font-weight:800;margin:2px 0 0;letter-spacing:0;line-height:1.25;word-break:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsearch{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;background:var(--soft);border:0;border-radius:26px;padding:0 18px;color:var(--muted);font:inherit;font-size:15px;margin:18px 0 20px;cursor:pointer;text-align:left}
.hsearch svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex:none}
.pbanner{position:relative;border-radius:24px;overflow:hidden;margin:0 0 22px;min-height:176px;display:flex;align-items:flex-end;color:var(--bantext,#fff);box-shadow:0 10px 28px rgba(0,0,0,.16)}
.pbanner>img,.pbanner>.hillsart{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pbanner .pin{position:relative;width:100%;padding:18px;background:var(--banpin,linear-gradient(to top,rgba(8,18,12,.62),rgba(8,18,12,0)))}
.pbanner h2{color:var(--bantext,#fff);margin:0 0 2px;font-size:16px;font-weight:600}
.pbanner .pnum{font-size:30px;font-weight:600;line-height:1.2}
.pbanner .bar{background:var(--banbartrack,rgba(255,255,255,.30));margin:10px 0 8px}
.pbanner .bar i{background:var(--bantext,#fff)}
.pbanner .pmot{font-size:13.5px;margin:0;opacity:.94}
.leafdeco{position:absolute;top:12px;right:14px;width:38px;height:38px;opacity:.8}
.banqa{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;scrollbar-width:none}.banqa button{flex:none;min-width:76px;scroll-snap-align:start;min-height:0;padding:10px 4px;border-radius:14px;border:0;background:var(--banqabg,rgba(255,255,255,.18));color:var(--bantext,#fff);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}.banqa button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.banrings{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x proximity;justify-content:safe center;padding:2px 2px 6px;margin:10px 0 12px;scrollbar-width:none}.banrings>div{flex:none;scroll-snap-align:center}.banrings::-webkit-scrollbar,.banqa::-webkit-scrollbar{display:none}
@keyframes lick1{0%,100%{transform:scaleY(1) skewX(0deg)}30%{transform:scaleY(1.05) skewX(-2deg)}55%{transform:scaleY(1.02) skewX(1.5deg)}80%{transform:scaleY(1.06) skewX(-1deg)}}
@keyframes lick2{0%,100%{transform:scaleY(1) skewX(0deg)}25%{transform:scaleY(1.08) skewX(2.5deg)}50%{transform:scaleY(1.03) skewX(-2deg)}75%{transform:scaleY(1.07) skewX(1deg)}}
@keyframes lick3{0%,100%{transform:scaleY(1)}40%{transform:scaleY(1.06)}70%{transform:scaleY(1.02)}}
.fl-out,.fl-mid,.fl-core{transform-box:fill-box;transform-origin:50% 100%}
.fl-out{animation:lick1 1.6s ease-in-out infinite}
.fl-mid{animation:lick2 1.1s ease-in-out infinite}
.fl-core{animation:lick3 .7s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.03)}}
@keyframes smoke{0%{opacity:0;transform:translateY(3px)}30%{opacity:.85}100%{opacity:0;transform:translateY(-7px)}}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3s ease-in-out infinite}
.smoke{animation:smoke 2.6s ease-out infinite}
@media (prefers-reduced-motion:reduce){.fl-out,.fl-mid,.fl-core,.breathe,.smoke{animation:none}}
.qah{margin:0 0 10px;font-size:20px}
.qa{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -22px;padding:2px 22px 20px}
.qa::-webkit-scrollbar{display:none}
.qac{flex:0 0 150px;background:var(--soft);border:0;border-radius:20px;padding:14px;color:var(--text);text-align:left;cursor:pointer;font:inherit}
.qac .qic{width:44px;height:44px;border-radius:14px;background:var(--accsoft);color:var(--accent);display:grid;place-items:center;margin-bottom:10px}
.qac .qic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.qac b{display:block;font-size:15px;font-weight:600}
.qac small{color:var(--muted);font-size:12.5px;display:block;margin-top:2px;line-height:1.4}
.qac small.live{color:var(--accent);font-weight:600}
.tprevh{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px}
.tprevh h2{margin:0;font-size:20px}
/* ---- timer / stopwatch ---- */
.drum{display:flex;gap:10px;justify-content:center;align-items:flex-start;margin:10px 0 2px}
.dcol{height:150px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;min-width:88px;text-align:center}
.dcol::-webkit-scrollbar{display:none}
.dcol div{height:50px;line-height:50px;scroll-snap-align:center;font-size:21px;color:var(--muted);font-variant-numeric:tabular-nums}
.dcol div.on{font-size:31px;font-weight:600;color:var(--text)}
.dsep{font-size:28px;color:var(--muted);padding-top:48px;font-weight:600}
.dlab{font-size:13px;color:var(--muted);text-align:center;margin:0 0 4px}
/* ---- floating quick-launch ---- */
.fab{position:fixed;right:20px;bottom:calc(88px + env(safe-area-inset-bottom));width:60px;height:60px;min-height:0;padding:0;border-radius:50%;background:var(--accent);color:var(--onacc);font-size:32px;font-weight:400;line-height:1;z-index:6;box-shadow:0 10px 26px rgba(0,0,0,.24);display:grid;place-items:center;transition:transform .22s ease}
.fab.open{transform:rotate(45deg)}
.fab[hidden]{display:none}
/* ---- FAB speed-dial menu (opens from the + button) ---- */
.fabmenu{position:fixed;right:20px;bottom:calc(160px + env(safe-area-inset-bottom));z-index:7;display:flex;flex-direction:column;align-items:flex-end;gap:10px;transform-origin:bottom right;animation:fabmenuin .22s cubic-bezier(.2,.9,.25,1.15)}
.fabmenu button{display:flex;align-items:center;gap:10px;background:var(--soft);color:var(--text);border:0;border-radius:999px;padding:10px 16px 10px 12px;min-height:48px;font:inherit;font-size:14.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.22);cursor:pointer;animation:fabitem .2s ease backwards}
.fabmenu button svg{width:22px;height:22px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fabmenu button:active{transform:scale(.94)}
@keyframes fabmenuin{from{opacity:0;transform:scale(.55) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes fabitem{from{opacity:0;transform:translateY(10px) scale(.88)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fab,.fabmenu,.fabmenu button{animation:none!important;transition:none!important}}
#splash{position:fixed;inset:0;background:linear-gradient(#1C1C1C,#000000);z-index:9999;display:grid;place-items:center;animation:splashOut .2s ease .8s forwards}
.splash-bars{display:flex;align-items:flex-end;gap:14px;height:140px}
.splash-bars i{display:block;width:42px;border-radius:10px;opacity:0;transform-origin:bottom;animation:splashUp .25s ease var(--d) forwards}
@keyframes splashUp{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:scaleY(1)}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash{display:none}}
</style>

var BNDIG={'০':0,'১':1,'২':2,'৩':3,'৪':4,'৫':5,'৬':6,'৭':7,'৮':8,'৯':9};
function asc(s){return String(s).replace(/[০-৯]/g,function(c){return BNDIG[c]})}
function cleanSubj(a){var o=[];(Array.isArray(a)?a:[]).forEach(function(x){x=str(x,30).trim();if(x&&o.indexOf(x)<0&&o.length<60)o.push(x)});return o}
function unionSubj(a,b){var o=a.slice();b.forEach(function(x){if(o.indexOf(x)<0)o.push(x)});return o}
function norm(s){return String(s).toLowerCase().replace(/\s+/g,' ').trim()}
function parseDur(s){
  s=asc(s).toLowerCase().trim();if(!s)return null;
  var m=/^(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hour|hours)\s*(?:(\d+)\s*(?:m|min|mins|minute|minutes)?)?$/.exec(s);
  if(m)return Math.round(parseFloat(m[1])*60+(m[2]?parseInt(m[2],10):0));
  m=/^(\d+)\s*(?:m|min|mins|minute|minutes)?$/.exec(s);if(m)return parseInt(m[1],10);
  m=/^(\d+):(\d{1,2})$/.exec(s);if(m)return parseInt(m[1],10)*60+parseInt(m[2],10);
  return NaN}
function parseDate(s){
  var m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/.exec(asc(s).trim());if(!m)return null;
  var y=+m[1],mo=+m[2],d=+m[3],t=new Date(y,mo-1,d);
  if(y<2000||y>2100||t.getFullYear()!==y||t.getMonth()!==mo-1||t.getDate()!==d)return null;
  return y+'-'+pad(mo)+'-'+pad(d)}
function kvOf(seg){var m=/^\s*([A-Za-z_]+)\s*[:=]\s*([\s\S]*)$/.exec(seg);return m?[m[1].toUpperCase(),m[2].trim()]:null}
function parseRoutineText(raw,existing){
  var P={days:[],tasks:[],subjects:[],limit:null,hasBacklog:false,errors:[],warns:[]};
  var lines=String(raw||'').replace(/^\uFEFF/,'').split(/\r?\n/),cur,dm={},sumT={},known=(existing||[]).slice();
  function err(i,m){if(P.errors.length<12)P.errors.push('Line '+(i+1)+': '+m)}
  function warn(i,m){if(P.warns.length<30)P.warns.push('Line '+(i+1)+': '+m)}
  function canon(n){n=str(n,30).trim();if(!n)return null;var l=n.toLowerCase(),k=null;for(var j=0;j<known.length;j++)if(known[j].toLowerCase()===l){k=known[j];break}if(!k){k=n;known.push(k)}if(P.subjects.indexOf(k)<0&&P.subjects.length<60)P.subjects.push(k);return k}
  function mins(v,i){var x=parseDur(v);if(x===null)return null;if(!(x>=1&&x<=1440)){warn(i,'Time could not be read, so it was ignored.');return null}return x}
  function setNote(i,v){if(cur===undefined){err(i,'NOTE comes before any DATE line.');return}if(cur)dm[cur].note=str(v,300).trim()}
  function setPlan(i,v){if(cur===undefined){err(i,'PLANNED comes before any DATE line.');return}if(cur)dm[cur].planned=mins(v,i)}
  for(var i=0;i<lines.length;i++){
    var L=lines[i].replace(/\*\*/g,'').replace(/`/g,'').trim();
    if(!L||/^(-{3,}|={3,})$/.test(L))continue;
    L=L.replace(/^(?:#+\s*|[-*•>]\s+|\d+[.)]\s+)+/,'');
    var m=/^(STUDY_ROUTINE_V1|DATE|DAY|NOTE|PLANNED|LIMIT|SUBJECTS?|TASK|BACKLOG)\b\s*[:=]?\s*([\s\S]*)$/i.exec(L);
    if(!m){warn(i,'Line not recognized and skipped.');continue}
    var k=m[1].toUpperCase(),rest=m[2].trim();
    if(k==='STUDY_ROUTINE_V1')continue;
    if(k==='BACKLOG'){cur=null;P.hasBacklog=true;continue}
    if(k==='LIMIT'){var lv=parseDur(rest);if(lv>=60&&lv<=1440)P.limit=lv;else warn(i,'Daily limit must be between 1h and 24h, so it was ignored.');continue}
    if(k==='SUBJECTS'||k==='SUBJECT'){rest.split(/[,;|]/).forEach(function(n){canon(n)});continue}
    if(k==='DATE'||k==='DAY'){
      var ps=rest.split('|'),d=parseDate(ps[0]);
      if(!d){err(i,'Date is missing or not valid. Use YYYY-MM-DD.');cur=undefined;continue}
      cur=d;if(!dm[d]){dm[d]={date:d,planned:null,note:'',red:false};P.days.push(dm[d])}
      ps.slice(1).forEach(function(sg){var kv=kvOf(sg);if(!kv){if(sg.trim().toUpperCase()==='RED')dm[d].red=true;return}if(kv[0]==='NOTE')setNote(i,kv[1]);else if(kv[0]==='PLANNED')setPlan(i,kv[1]);else if(kv[0]==='MARK'&&/RED/i.test(kv[1]))dm[d].red=true});
      continue}
    if(k==='NOTE'){setNote(i,rest);continue}
    if(k==='PLANNED'){setPlan(i,rest);continue}
    if(cur===undefined){err(i,'This task comes before any DATE or BACKLOG line.');continue}
    var tp=rest.split('|'),tx=tp[0].trim(),tsub=[],tch='',tm=null;
    tp.slice(1).forEach(function(sg){var kv=kvOf(sg);
      if(kv&&/^(SUBJECTS?|SUBJ)$/.test(kv[0]))kv[1].split(/[,;+&\/]/).forEach(function(n){var c=canon(n);if(c&&tsub.indexOf(c)<0&&tsub.length<3)tsub.push(c)});
      else if(kv&&/^(CHAPTER|CH|LESSON)$/.test(kv[0]))tch=kv[1];
      else if(kv&&/^(TIME|MINS|MINUTES|DURATION)$/.test(kv[0]))tm=mins(kv[1],i);
      else tx+=' | '+sg.trim()});
    if(!tx){err(i,'This task has no description.');continue}
    if(P.tasks.length>=5000){err(i,'The routine is too large (max 800 dates or 5000 tasks).');break}
    P.tasks.push({id:uid(),date:cur,subj:tsub,chapter:str(tch,100),text:str(tx,200),mins:tm});
    if(cur&&tm)sumT[cur]=(sumT[cur]||0)+tm}
  if(!P.days.length&&!P.tasks.length&&!P.errors.length)P.errors.push('No dates or tasks were found. Paste the full answer from the AI.');
  if(P.days.length>800)P.errors.push('The routine is too large (max 800 dates or 5000 tasks).');
  P.days.forEach(function(d){var s=sumT[d.date]||0;if(d.planned!=null&&s)d.planned=d.planned>s?d.planned-s:null});
  P.days.sort(byDate);return P}

function applyParsed(P,mode){

    state.routine={days:D,tasks:T};state.done={};state.subjects=P.subjects.slice();
    if(P.limit)state.prefs.limit=P.limit;
    state.routineVersion='custom';selKey='';sel={};return}
  if(mode==='merge'){
    var have={};R().tasks.forEach(function(t){have[(t.date||'')+'|'+norm(t.text)]=1});
    D.forEach(function(d){var e=dayOf(d.date);if(!e)R().days.push(d);else{if(e.planned==null&&d.planned!=null)e.planned=d.planned;if(!e.note&&d.note)e.note=d.note;if(d.red)e.red=true}});
    T.forEach(function(t){var k=(t.date||'')+'|'+norm(t.text);if(have[k])return;have[k]=1;R().tasks.push(t)});
    R().days.sort(byDate);state.subjects=unionSubj(state.subjects||[],P.subjects);return}

  var old={},keep=[];
  R().tasks.forEach(function(t){if((t.date&&ds[t.date])||(!t.date&&P.hasBacklog)){var k=(t.date||'')+'|'+norm(t.text);(old[k]=old[k]||[]).push(t.id)}else keep.push(t)});
  T.forEach(function(t){var k=(t.date||'')+'|'+norm(t.text);if(old[k]&&old[k].length)t.id=old[k].shift()});
  Object.keys(old).forEach(function(k){old[k].forEach(function(id){delete state.done[id]})});
  R().tasks=keep.concat(T);
  D.forEach(function(d){var e=dayOf(d.date);if(e){e.planned=d.planned;e.note=d.note;if(d.red)e.red=true}else R().days.push(d)});
  R().days.sort(byDate);state.subjects=unionSubj(state.subjects||[],P.subjects)}

function studyStats(){
  var td=today(),planned={},studied={};
  R().tasks.forEach(function(t){if(t.date)planned[t.date]=1});
  Object.keys(state.time||{}).forEach(function(d){if(logged(d)>0)studied[d]=1});
  var all=Object.keys(planned);
  Object.keys(studied).forEach(function(d){if(!planned[d]&&all.indexOf(d)<0)all.push(d)});
  all.sort();
  var start=all.length?all[0]:td,back=addDays(td,-1825);
  if(start<back)start=back;
  var spent=(state.shop&&state.shop.spent)||0;
  var fds=((state.shop&&state.shop.freezeDates)||[]).slice().sort();
  var subjBy={};
  (state.sessions||[]).forEach(function(s){if(!s||!s.date)return;var set=subjBy[s.date];if(!set)set=subjBy[s.date]={};if(s.subj)set[s.subj]=1});
  function subjCount(d){var o=0,s=subjBy[d];if(s)Object.keys(s).forEach(function(){o++});return o}
  var wst=(state.prefs&&state.prefs.weekStart!=null)?state.prefs.weekStart:6;
  var firstHit7='';
  (function(){
    var streak=0,fi=0;
    for(var d=start;d<=td;d=addDays(d,1)){
      if(studied[d]){streak++;if(!firstHit7&&streak>=7)firstHit7=d}
      else if(d!==td&&planned[d]){
        if(fi<fds.length&&fds[fi]<=d)fi++;
        else streak=0;
      }
    }
  })();
  var allFds=fds.slice();
  if(firstHit7)allFds.push(firstHit7);
  allFds.sort();
  var bal=0,streak=0,lastBreak='',maxStreak=0,fi2=0,frozenDays=[],freeUsed=false,questBonus=0;
  var wkCount={};
  for(var d2=start;d2<=td;d2=addDays(d2,1)){
    if(studied[d2]){
      bal+=Math.floor(logged(d2)/10);streak++;
      if(streak>maxStreak)maxStreak=streak;
      if(subjCount(d2)>=3)questBonus+=5;
      if(logged(d2)>=120)questBonus+=5;
      var ws=weekStartOf(d2,wst);wkCount[ws]=(wkCount[ws]||0)+1;
    }
    else if(d2!==td&&planned[d2]){
      if(fi2<allFds.length&&allFds[fi2]<=d2){
        if(firstHit7&&allFds[fi2]===firstHit7)freeUsed=true;
        frozenDays.push(d2);fi2++;

      else{if(streak>0)bal=Math.floor(bal*0.9);streak=0;lastBreak=d2}
    }
  }

  bal+=questBonus;

    week.push({d:wd,lab:['Su','Mo','Tu','We','Th','Fr','Sa'][i],state:st,today:wd===td});
  }

  var XL=xpLevel(xp),LG=leagueStats(),BD=badgesFor(maxStreak);
  return{streak:streak,coins:Math.max(0,bal-spent),week:week,lastBreak:lastBreak,frozenDays:frozenDays,freezesAvail:allFds.length-fi2,maxStreak:maxStreak,freeFreeze:{earned:firstHit7,used:freeUsed},questBonus:questBonus,xp:xp,level:XL.level,levelNext:XL.next,levelNeed:XL.need,levelPct:XL.pct,league:LG,badges:BD}
}
function weekStartOf(d,wst){return addDays(d,-((pd(d).getDay()-wst+7)%7))}
function xpLevel(xp){
  function th(l){return l<=10?[0,300,900,1800,3000,4500,6500,9000,12000,16000][l-1]:16000+(l-10)*5000}

}
function leagueStats(){
  var td=today(),wst=(state.prefs&&state.prefs.weekStart!=null)?state.prefs.weekStart:6;
  var weeks=[];
  for(var w=0;w<5;w++){
    var ws=addDays(weekStartOf(td,wst),-7*w),tot=0;
    for(var i=0;i<7;i++)tot+=logged(addDays(ws,i));
    weeks.push({start:ws,mins:tot,cur:w===0});
  }
  var cur=weeks[0].mins,above=0,allZero=true;
  weeks.forEach(function(x){if(x.mins>cur)above++;if(x.mins>0)allZero=false});
  var rank=above+1,div=rank===1?'Gold':(rank===2?'Silver':'Bronze'),need=0;
  if(allZero){div='Bronze';need=1}
  else if(div==='Silver'){var top=0;weeks.forEach(function(x){if(x.mins>top)top=x.mins});need=top-cur}
  else if(div==='Bronze'){var srt=weeks.map(function(x){return x.mins}).sort(function(a,b){return b-a});need=srt[1]-cur}

}

function vSHowto(){var h=head('How to use');
  h+='<h3>Account ও Sync</h3><p>Google বা ইমেইল দিয়ে সাইন ইন করলে ডেটা ক্লাউডে সিঙ্ক হবে। সাইন ইন থাকলে সেভ করলেই ডেটা নিজে থেকে ক্লাউডে উঠবে। Log out করলে ফোনের ডেটা মুছে যাবে, ক্লাউড ডেটা আবার সাইন ইন করলে ফিরে আসবে। Account delete করলে ফোন + ক্লাউড দুইটাই চিরতরে মুছে যাবে।</p>';
  h+='<h3>রুটিন</h3><p>রুটিন একবার আপলোড করলেই পুরো অ্যাপ চলে। আলাদা কোনো একদিনের জন্য নিজের মতো রুটিন বানাতে চাইলে Routine-এ “রুটিন বানান” চাপো — ফাইল লাগবে না, তারিখ বাছো, প্রতি লাইনে একটা করে কাজ লিখো, একবারে সেভ করো। পরে প্রতিটা কাজ আলাদাভাবে এডিট করা যাবে। কাজ সরাতে বা কপি করতে চাইলে ওই দিনের কাজ সিলেক্ট করো।</p>';
  h+='<h3>রেকর্ড ও গ্রাফ</h3><p>গ্রাফে গাঢ় বার মানে তুমি যতক্ষণ পড়েছো, পেছনের হালকা বার মানে ওই দিনের লক্ষ্য। কোনো বারে ট্যাপ করলে ওই সময়ের বিষয়গুলো দেখাবে, আবার একই বারে বা বাইরে ট্যাপ করলে বন্ধ হবে। টাইমার, স্টপওয়াচ বা Add record দিয়ে রেকর্ড যোগ করা যায়। প্রতি ১০ মিনিট পড়ায় ১ কয়েন পাওয়া যায়। স্ট্রিক ফ্রিজ মিস হওয়ার আগেই কিনে রাখতে হয়, তাহলে ওই দিনটা নিজে নিজে বাঁচবে।</p>';
  h+='<h3>চেহারা</h3><p>ব্র্যান্ড ব্লু হলো ডিফল্ট পরিচয়। যেকোনো অ্যাকসেন্ট লাইট ও ডার্ক দুটোতেই কাজ করে। নিজের পছন্দের রং বাছলে পুরো অ্যাপ ওই রং অনুসরণ করবে, আর তার ওপরের লেখা নিজে থেকে পড়ার মতো থাকবে। Settings → Language & Text থেকে লেখার আকার বদলানো যায়, পুরো অ্যাপে সেটা লাগবে।</p>';
  h+='<h3>Schedule</h3><p>Schedule খুললেই ডিফল্ট interval দেখাবে। Pinch করে বা + / − দিয়ে সাময়িকভাবে interval বদলানো যাবে। Schedule Settings থেকে ডিফল্ট interval ঠিক করা যায়।</p>';
  h+='<h3>ব্যাকআপ</h3><p>Settings → Routine & Data থেকে ব্যাকআপ এক্সপোর্ট, ইমপোর্ট, চেক ও শেয়ার করা যায়। রুটিন সরালে পড়ার সময়, দুর্বল অধ্যায় ও ভুল থেকে যাবে। Reset progress চাপলে টিক, পড়ার সময়, দুর্বল অধ্যায় ও ভুল মুছে যাবে, রুটিন থাকবে — তাই আগে ব্যাকআপ নিয়ে রাখো।</p>';
  h+='<h3>কাউন্টডাউন, লগ ও ওয়ার্কআউট</h3><p>Home থেকে নাম, তারিখ আর সময় দিয়ে যত খুশি কাউন্টডাউন যোগ করা যায়, কোনো ডিফল্ট কাউন্টডাউন নেই। Logs-এ দুর্বল অধ্যায় ও ভুলের তালিকা থাকে। Workout সেকশন থেকে চ্যালেঞ্জ শুরু করা যায়, আর সেখানকার গ্রাফে অগ্রগতি দেখা যায়।</p>';
  return h}
function vSAbout(){var bn=state.prefs.lang==='bn';var h=head(bn?'Agradia সম্পর্কে':'About Agradia');

  h+='<h3>'+(bn?'প্রাইভেসি পলিসি':'Privacy Policy')+'</h3><p class="sub">'+(bn?'Agradia একটা ব্যক্তিগত পড়াশোনা ট্র্যাকার। তোমার রুটিন, টিক, পড়ার সময়, দুর্বল অধ্যায়, ভুলের লগ, ওয়ার্কআউট ডেটা, নাম আর avatar (যদি দিয়ে থাকো) এই ফোনেই থাকে। সাইন ইন করলে একই ডেটা তোমার নিজের Firebase অ্যাকাউন্টে (প্রজেক্ট agradia-test) সিঙ্ক হয়, per-account নিয়ম দিয়ে সুরক্ষিত — শুধু তুমিই পড়তে বা লিখতে পারবে। কোনো ডেটা বিক্রি করা হয় না, কোনো বিজ্ঞাপন দেখানো হয় না, আর লোকেশন, কন্ট্যাক্ট বা বিজ্ঞাপন ট্র্যাকিং সংগ্রহ করা হয় না। লগআউটের সময় প্রথমে ক্লাউডে সিঙ্ক হয়, তারপর এই ফোনের ডেটা মুছে যায়; ক্লাউড কপি Delete account চাপলে মুছে যাবে, নাহলে থেকে যাবে।':'Agradia is a personal study tracker. Your routine, ticks, study time, weak chapters, mistakes, workout data, name and avatar (if you set them) are stored on this phone. If you sign in, the same data syncs to your own account in Firebase (project agradia-test), protected by per-account rules so only you can read or write it. No data is sold, no ads are shown, and no location, contacts or advertising tracking is collected. Logging out first syncs to the cloud, then wipes this phone; the cloud copy is deleted when you use Delete account, otherwise it stays.')+'</p>';

async function applyMerge(u, snap){

  var mergedW=mergeWorkout(snap.data().workout||'', workoutState());
  if(mergedW===null){ stA(__L('Merge failed — data was not changed. You stay signed in.','Merge হয়নি — data বদলানো হয়নি। Sign in থাকলো।')); return; }
  try{ localStorage.setItem('ssc2027.data.v2.backup-before-cloud', appState()); }catch(e){}

async function handleUser(u){
  try{
    var linked=getLinked(), ref=doc(db,'users',u.uid), snap=await getDoc(ref), hasCloud=snap.exists()&&!!(snap.data().state||snap.data().workout);
    if(!linked){
      if(!hasCloud){ await uploadLocal(u.uid); setLinked(u.uid); stA(__L('Account linked — phone data uploaded to cloud.','Account linked — phone-এর data cloud-এ উঠেছে।')); return; }
      if(isEmptyPhone()){ if(await loadCloudState(u.uid, snap.data())){ setTimeout(function(){ location.reload(); }, 600); } return; }

      if(c===1){ await applyMerge(u.uid, snap); }

      var c2=await chooseMerge('অন্য account');

      else if(c2===2){ var s2=await getDoc(ref); if(s2.exists()&&(s2.data().state||s2.data().workout)){ if(await loadCloudState(u.uid, s2.data())){ setTimeout(function(){ location.reload(); }, 600); } } else { setLinked(u.uid); stA(__L('No cloud data in this account — phone data will stay.','এই account-এ cloud data নেই — phone-এর data-ই থাকবে।')); } }
