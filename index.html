<style>
:root{--bg:#120F1D;--panel:#181324;--panel2:#221A36;--line:#35294F;--neon:#C033FF;--neon2:#B341F9;--text:#F6F1FF;--lav:#CFC3F0;--warn:#FF8FB1;--ok:#8CF0B4;--glow:#2B1747;--rgb:192,51,255}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(900px 400px at 85% -5%,var(--glow) 0%,transparent 70%),var(--bg);color:var(--text);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Hind Siliguri","Kohinoor Bangla",sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom));min-height:100vh}
main{max-width:640px;margin:0 auto}
h1{font-size:26px;margin:0;line-height:1.15}h2{font-size:21px;margin:0 0 10px}h3{font-size:18px;margin:14px 0 6px}
.sub{color:var(--lav);font-size:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px}
.glow{border-color:var(--neon2);box-shadow:0 0 22px rgba(var(--rgb),.22)}
.top{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.av{width:72px;height:72px;border-radius:50%;border:3px solid var(--neon);box-shadow:0 0 18px rgba(var(--rgb),.5);flex:none;overflow:hidden;background:#221A36}
.hero{display:flex;gap:16px;align-items:center}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:27px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;flex:1;min-width:0}
.stat{background:var(--panel2);border-radius:14px;padding:10px}
.stat b{display:block;font-size:26px;color:var(--neon2)}.stat span{color:var(--lav);font-size:14.5px;line-height:1.25;display:block}
.bar{height:14px;background:#2A2142;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--neon2),var(--neon));border-radius:9px;transition:width .3s}
.bar.warn i{background:linear-gradient(90deg,#FF8FB1,#C033FF)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.pill{background:var(--neon2);color:#fff;font-weight:700;border-radius:20px;padding:4px 12px;font-size:16px;white-space:nowrap}
.pill.warn{background:var(--warn);color:#2a0b18}
.task{display:flex;gap:14px;align-items:center;min-height:58px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:19px;cursor:pointer}
.task:last-of-type{border-bottom:0}
.task input{position:absolute;opacity:0;width:0;height:0}
.box{width:34px;height:34px;border-radius:10px;border:2.5px solid var(--neon2);flex:none;display:grid;place-items:center;background:var(--bg)}
.task input:checked+.box{background:var(--neon);border-color:var(--neon);box-shadow:0 0 12px rgba(var(--rgb),.7)}
.task input:checked+.box:after{content:"";width:9px;height:17px;border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg) translate(-1px,-2px)}
.task input:checked~span{color:var(--lav);text-decoration:line-through;text-decoration-color:var(--neon2)}
.task input:focus-visible+.box{outline:3px solid #fff}
.flag{background:#3a1626;border:1px solid var(--warn);color:#FFD3E0;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:16px}
.note{background:var(--panel2);border-radius:12px;padding:10px 12px;color:var(--lav);font-size:16px;margin:10px 0}
.chips{display:flex;gap:10px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chip{flex-direction:column;flex:none;min-width:74px;min-height:62px;border:1.5px solid var(--line);background:var(--panel);color:var(--text);border-radius:16px;font:inherit;font-size:16px;padding:6px 10px;text-align:center;position:relative}
.chip b{display:block;font-size:20px}
.chip.sel{border-color:var(--neon);background:var(--panel2);box-shadow:0 0 14px rgba(var(--rgb),.4)}
.chip.today:after{content:"";position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--ok)}
.chip.full{border-color:var(--ok)}
button,.btn{font:inherit;font-weight:700;min-height:52px;padding:0 18px;border-radius:14px;border:0;background:var(--neon);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center}
button.ghost,.btn.ghost{background:transparent;border:1.5px solid var(--neon2);color:var(--text)}
button.danger{background:#B3173F}
button.sm{min-height:44px;padding:0 12px;font-size:15px}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns>*{flex:1 1 140px}
input,select,textarea{width:100%;min-height:52px;background:var(--bg);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;margin:4px 0 10px}

label.f{color:var(--lav);font-size:16px;display:block}
.time{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.item{background:var(--panel2);border-radius:14px;padding:12px;margin:0 0 10px}
.item small{color:var(--lav);font-size:15px;display:block}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(18,15,29,.96);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);z-index:5}
.tabs button{flex:1;background:none;color:var(--lav);min-height:58px;font-size:14.5px;flex-direction:column;gap:2px;padding:0 2px;border-radius:12px}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:#fff;background:var(--panel2);box-shadow:inset 0 -3px 0 var(--neon)}
.toast{position:fixed;left:14px;right:14px;bottom:calc(88px + env(safe-area-inset-bottom));background:var(--panel2);border:1px solid var(--neon2);border-radius:14px;padding:14px;z-index:9;text-align:center;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(5,3,10,.8);display:grid;place-items:center;padding:20px;z-index:10}
.modal .card{max-width:420px;width:100%;margin:0}
ol,ul{padding-left:22px;margin:6px 0}li{margin:7px 0}
.leg{display:grid;grid-template-columns:auto 1fr;gap:6px 12px}.leg b{color:var(--neon2)}
.ok{color:var(--ok)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.erow{border:1px solid var(--line);border-radius:14px;padding:6px 8px;margin:8px 0;background:var(--panel2)}
.erow.on{border-color:var(--neon)}
.erow .task{border:0;min-height:52px}
.erow .task input:checked~.tx{text-decoration:none;color:var(--text)}
.box.sq{border-radius:7px}
.btns3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:4px}
.btns3 button{padding:0 4px}
button:disabled{opacity:.4}
.tx{flex:1;min-width:0}.tt{display:block;word-break:break-word}
.task small{display:block;color:var(--lav);font-size:14.5px;line-height:1.3}
.note.big{font-size:19px;color:var(--text)}
.nav{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;margin-bottom:12px}
.nav input.jump{margin:0;padding:0 8px}.nav button{padding:0 6px;white-space:nowrap}
.selbar{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--panel2);border:1.5px solid var(--neon);border-radius:16px;padding:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;z-index:6;box-shadow:0 0 20px rgba(var(--rgb),.35)}
.selbar b{flex:1 0 100%;font-size:16px}.selbar button{flex:1}
.modal{display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding-top:8vh}
.dlg{margin:0 0 40px}
.err{color:var(--warn);min-height:0;margin:0 0 8px;font-weight:600}
.scs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.sc{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;min-height:46px;padding:0 12px;font-size:16px;cursor:pointer}
.sc.wide{display:flex;margin:8px 0}
.sc input{width:22px;height:22px;min-height:0;margin:0;accent-color:#C033FF}
.upd{position:fixed;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;z-index:11;background:var(--panel2);border:1.5px solid var(--neon);border-radius:14px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.upd span{flex:1 0 100%}.upd button{flex:1}
.toast{display:flex;gap:10px;align-items:center;justify-content:space-between;text-align:left}
.toast span{flex:1}
.acc{padding:0}.acc>summary{list-style:none;cursor:pointer;min-height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:19px;font-weight:700}
.acc>summary::-webkit-details-marker{display:none}.acc>summary:after{content:"";width:11px;height:11px;border:solid var(--neon);border-width:0 3px 3px 0;transform:rotate(45deg);transition:transform .2s;margin-top:-4px}
.acc[open]>summary:after{transform:rotate(225deg);margin-top:4px}.acc>div{padding:0 16px 16px}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.sw button{min-height:56px;font-size:15px;border:2px solid var(--line);background:var(--bg);color:var(--text);flex-direction:column;gap:4px;padding:6px}
.sw button i{width:30px;height:12px;border-radius:6px;display:block}.sw button.on{border-color:#fff}
input[type=color]{padding:3px;min-height:52px}
</style>
</head>

<script>
"use strict";
var APP_VERSION='2.2.0',SCHEMA=2,KEY='ssc2027.data.v2',OLDKEY='ssc2027.tracker.v1';
var SUBJ=['ICT','Islam','Chemistry','BGS','Biology','HM','Physics','Eng 1st','Eng 2nd','Bangla 1st','Bangla 2nd'];

var DEF=window.DEFAULT_ROUTINE,EARLY=window.EARLIER_EXAM_PREP,DRE=/^\d{4}-\d{2}-\d{2}$/;
var RULES=['On the day before an exam and until the exam morning, revise only that exam\'s subject and cover the whole book.','Prioritize upcoming exams. On gap days, focus on the subject of the next exam.','After an exam, begin preparing for the next subject that afternoon.','Daily study time must not exceed your daily limit (7h 30m by default; you can change it in Settings).','The exact exam timetable has not been supplied. No exam dates are shown as verified facts.','Subject-only instructions are kept exactly as written.'];
var LEG=[['ICT','Information and Communication Technology'],['Islam','Islamic Studies'],['C','Chemistry'],['BGS','Bangladesh and Global Studies'],['Bio','Biology'],['HM','Higher Mathematics'],['Eng 1st','English First Paper'],['Eng 2nd','English Second Paper'],['Bangla 1st','Bangla First Paper'],['Bangla 2nd','Bangla Second Paper'],['G','Grammar'],['L','Lesson'],['B','Block'],['rev','Revision']];
var state,memOnly=false,tab='home',hd='',followToday=true,selKey='',edit=false,sel={},undoStack=[],deferred=null,dragId=null,updating=false,persisted='';
/* ---------- helpers ---------- */
function pad(n){return(n<10?'0':'')+n}
function isoOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return isoOf(new Date())}
function pd(iso){var p=iso.split('-');return new Date(+p[0],p[1]-1,+p[2])}
function LOC(){return state&&state.prefs&&state.prefs.lang==='bn'?'bn-BD-u-nu-latn':'en-US'}
function fmtLong(iso){return pd(iso).toLocaleDateString(LOC(),{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
function fmtShort(iso){return pd(iso).toLocaleDateString(LOC(),{month:'short',day:'numeric'})}
function addDays(iso,n){var d=pd(iso);d.setDate(d.getDate()+n);return isoOf(d)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function str(v,n){return String(v==null?'':v).slice(0,n||300)}
function mn(v){var n=parseInt(v,10);return isFinite(n)&&n>0&&n<=1440?n:null}
function fmtMin(m){var h=Math.floor(m/60),r=m%60;return(h?h+'h':'')+(h&&r?' ':'')+(r||!h?r+'m':'')}
function uid(){return'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function byDate(a,b){return a.date<b.date?-1:a.date>b.date?1:0}
var toastT;function toast(m,label,fn){var e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';e.setAttribute('role','status');document.body.appendChild(e)}e.innerHTML='<span></span>';e.firstChild.textContent=m;if(label){var b=document.createElement('button');b.className='sm';b.textContent=label;b.onclick=function(){e.hidden=true;fn()};e.appendChild(b)}e.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){e.hidden=true},label?7000:4500)}
function modal(title,body,btns,validate){return new Promise(function(res){
  var m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="card glow dlg" role="dialog" aria-modal="true"><h2>'+esc(title)+'</h2>'+body+'<div class="err" id="err" role="alert"></div><div class="btns">'+btns.map(function(b,i){return'<button class="'+(b.cls||'')+'" data-bi="'+i+'">'+esc(b.label)+'</button>'}).join('')+'</div></div>';
  function q(s){return m.querySelector(s)}
  m.addEventListener('click',function(e){var b=e.target.closest('button[data-bi]');if(!b&&e.target!==m)return;var bt=b?btns[+b.dataset.bi]:{val:null};
    if(bt.v&&validate){var er=validate(q);if(er){q('#err').textContent=er;return}}
    res({val:bt.val,q:q});setTimeout(function(){m.remove()},0)});
  document.body.appendChild(m);var f=m.querySelector('input,select,textarea');if(f&&f.type!=='date')f.focus()})}
function confirmBox(t,msg,ok,danger){return modal(t,'<p>'+esc(msg)+'</p>',[{label:'Cancel',cls:'ghost',val:false},{label:ok,cls:danger?'danger':'',val:true}]).then(function(r){return r.val===true})}
/* ---------- data + storage ---------- */
function fresh(){return{app:'ssc2027-tracker',schema:SCHEMA,routineVersion:DEF.version,routine:clone({days:DEF.days,tasks:DEF.tasks}),done:{},time:{},weak:[],mistakes:[],prefs:{limit:450,lang:'en',fs:'m',theme:{name:'purple',accent:'#C033FF',bg:'#120F1D'}}}}
function cleanRoutine(r){
  if(!r||!Array.isArray(r.days)||!Array.isArray(r.tasks))throw new Error('Routine data is missing.');
  var seen={},days=[],tasks=[],ids={};
  r.days.slice(0,800).forEach(function(d){if(d&&DRE.test(d.date)&&!seen[d.date]){seen[d.date]=1;days.push({date:d.date,planned:mn(d.planned),note:str(d.note,300)})}});
  r.tasks.slice(0,5000).forEach(function(t){if(!t||!str(t.text,200).trim())return;var id=str(t.id,60).replace(/[^\w-]/g,'_');if(!id||ids[id])id=uid();ids[id]=1;var dt=DRE.test(t.date)?t.date:null;if(dt&&!seen[dt]){seen[dt]=1;days.push({date:dt,planned:null,note:''})}
    tasks.push({id:id,date:dt,subj:(Array.isArray(t.subj)?t.subj:[]).filter(function(s){return SUBJ.indexOf(s)>-1}),chapter:str(t.chapter,100),text:str(t.text,200),mins:mn(t.mins)})});
  days.sort(byDate);return{days:days,tasks:tasks}}
function cleanTime(t){var o={};if(t&&typeof t==='object')Object.keys(t).forEach(function(k){if(DRE.test(k)&&t[k]){var h=Math.max(0,Math.min(24,parseInt(t[k].h,10)||0)),m=Math.max(0,Math.min(59,parseInt(t[k].m,10)||0));if(h||m)o[k]={h:h,m:m}}});return o}
function cleanWeak(a){return Array.isArray(a)?a.slice(0,500).map(function(w){return{id:str(w.id,40).replace(/[^\w-]/g,'_')||uid(),subject:str(w.subject,30),chapter:str(w.chapter,100),note:str(w.note,300),done:w.done===true}}):[]}
function cleanMis(a){return Array.isArray(a)?a.slice(0,1000).map(function(m){return{id:str(m.id,40).replace(/[^\w-]/g,'_')||uid(),date:str(m.date,20),subject:str(m.subject,30),chapter:str(m.chapter,100),what:str(m.what,400),fix:str(m.fix,400)}}):[]}
/* Schema 1 (first app version) kept only time, weak chapters and mistakes that are still meaningful. */
function migrateV1(o){var s=fresh();s.weak=cleanWeak(o.weak);s.mistakes=cleanMis(o.mistakes);var t={};
  if(o.time&&typeof o.time==='object')Object.keys(o.time).forEach(function(k){var m=/^d(\d\d)(\d\d)$/.exec(k);if(m)t['2026-'+m[1]+'-'+m[2]]=o.time[k]});
  s.time=cleanTime(t);s.migratedV1=true;return s}
function clean(o){
  if(!o||typeof o!=='object'||o.app!=='ssc2027-tracker')throw new Error('This file is not an SSC 2027 Tracker backup.');
  if(o.schema>SCHEMA)throw new Error('This data is from a newer app version. Update the app first.');
  if(!o.schema||o.schema<2)return migrateV1(o);
  var s=fresh();s.routine=cleanRoutine(o.routine);s.routineVersion=str(o.routineVersion,40)||'custom';
  if(o.done&&typeof o.done==='object')Object.keys(o.done).slice(0,6000).forEach(function(k){if(o.done[k]===true)s.done[k]=true});
  s.time=cleanTime(o.time);s.weak=cleanWeak(o.weak);s.mistakes=cleanMis(o.mistakes);
  var l=parseInt(o.prefs&&o.prefs.limit,10);s.prefs.limit=l>=60&&l<=1440?l:450;var th=o.prefs&&o.prefs.theme,HX=/^#[0-9a-fA-F]{6}$/;var lg=o.prefs&&o.prefs.lang;s.prefs.lang=lg==='bn'?'bn':'en';var fz=o.prefs&&o.prefs.fs;s.prefs.fs=FS[fz]?fz:'m';if(th&&HX.test(th.accent)&&HX.test(th.bg))s.prefs.theme={name:str(th.name,12),accent:th.accent,bg:th.bg};return s}
function load(){
  var raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){memOnly=true;state=fresh();toast('Storage is blocked in this browser. Export a backup before closing.');return}
  if(raw){try{state=clean(JSON.parse(raw));return}catch(e){try{localStorage.setItem(KEY+'.corrupt',raw)}catch(_){}state=fresh();toast('Saved data was unreadable. A copy was kept and the original routine was loaded. Import a backup to recover.');return}}
  var old=null;try{old=localStorage.getItem(OLDKEY)}catch(e){}
  if(old){try{state=migrateV1(JSON.parse(old));save();toast('Found data from the earlier app version. Study time, weak chapters and mistakes were kept. Old checkboxes belonged to the old routine and were not carried over. The old data is still stored.');return}catch(e){}}
  state=fresh();save()}
function save(){try{if(!memOnly)localStorage.setItem(KEY,JSON.stringify(state))}catch(e){memOnly=true;toast('Could not save. Export a backup from Settings.')}}
function snap(){undoStack.push(JSON.stringify({routine:state.routine,done:state.done}));if(undoStack.length>25)undoStack.shift()}
function undo(){var s=undoStack.pop();if(!s)return;var o=JSON.parse(s);state.routine=o.routine;state.done=o.done;sel={};save();render(true);toast('Undone.')}
function mutate(fn,msg){snap();fn();save();render(true);if(msg)toast(msg,'Undo',undo)}
/* ---------- routine queries ---------- */
function R(){return state.routine}

/* ---------- routine editing ---------- */
function curDate(){return DRE.test(selKey)?selKey:today()}
function hm(id,mins,lbl){return'<div class="time"><div><label class="f" for="'+id+'h">'+lbl+' hours</label><input id="'+id+'h" type="number" inputmode="numeric" min="0" max="24" value="'+(mins?Math.floor(mins/60)||'':'')+'"></div><div><label class="f" for="'+id+'m">Minutes</label><input id="'+id+'m" type="number" inputmode="numeric" min="0" max="59" value="'+(mins?mins%60||'':'')+'"></div></div>'}
function rd(q,id){return mn((parseInt(q('#'+id+'h').value,10)||0)*60+(parseInt(q('#'+id+'m').value,10)||0))}
function taskForm(t,date){
  var T=t||{text:'',chapter:'',subj:[],mins:null,date:date||null};
  var chips=SUBJ.map(function(s){return'<label class="sc"><input type="checkbox" value="'+esc(s)+'"'+(T.subj.indexOf(s)>-1?' checked':'')+'><span>'+esc(s)+'</span></label>'}).join('');
  modal(t?'Edit task':'Add task','<label class="f" for="fx">Description</label><input id="fx" maxlength="200" value="'+esc(T.text)+'"><label class="f">Subjects</label><div class="scs">'+chips+'</div><label class="f" for="fc">Chapter or lesson (optional)</label><input id="fc" maxlength="100" value="'+esc(T.chapter)+'">'+hm('fd0',T.mins,'Planned')+'<label class="f" for="fd">Date (empty = unscheduled backlog)</label><input id="fd" type="date" value="'+(T.date||'')+'">',[{label:'Cancel',cls:'ghost',val:0},{label:'Save task',val:1,v:true}],function(q){return q('#fx').value.trim()?'':'Enter a description.'}).then(function(r){
    if(r.val!==1)return;var q=r.q,text=q('#fx').value.trim().slice(0,200),ch=q('#fc').value.trim().slice(0,100),mins=rd(q,'fd0'),dt=q('#fd').value||null,sj=[].slice.call(r.q('.scs').querySelectorAll('input:checked')).map(function(i){return i.value});
    mutate(function(){if(dt)ensureDay(dt);if(t){var x=R().tasks.filter(function(a){return a.id===t.id})[0];if(!x)return;var mv=x.date!==dt;x.text=text;x.chapter=ch;x.mins=mins;x.subj=sj;x.date=dt;if(mv){R().tasks.splice(R().tasks.indexOf(x),1);R().tasks.push(x)}}else R().tasks.push({id:uid(),date:dt,subj:sj,chapter:ch,text:text,mins:mins})},t?'Task saved.':'Task added.')})}
function moveDlg(ids){
  if(!ids.length){toast('Select at least one task first.');return}
  modal('Move '+ids.length+' task'+(ids.length>1?'s':''),'<label class="f" for="md">New date</label><input id="md" type="date" value="'+(DRE.test(selKey)?selKey:today())+'"><label class="sc wide"><input type="checkbox" id="mb"><span>Move to unscheduled backlog instead</span></label><label class="sc wide"><input type="checkbox" id="mr"><span>Also clear completion ticks on these tasks</span></label><p class="sub">Ticks and study time are kept by default.</p>',[{label:'Cancel',cls:'ghost',val:0},{label:'Move',val:1,v:true}],function(q){return q('#mb').checked||q('#md').value?'':'Pick a date or choose backlog.'}).then(function(r){
    if(r.val!==1)return;var dt=r.q('#mb').checked?null:r.q('#md').value,rs=r.q('#mr').checked,set={};ids.forEach(function(i){set[i]=1});
    mutate(function(){var mv=R().tasks.filter(function(t){return set[t.id]});R().tasks=R().tasks.filter(function(t){return!set[t.id]});if(dt)ensureDay(dt);mv.forEach(function(t){t.date=dt;if(rs)delete state.done[t.id];R().tasks.push(t)});sel={}},'Moved '+ids.length+' task'+(ids.length>1?'s':'')+(dt?' to '+fmtShort(dt):' to backlog')+'.')})}
function dupTasks(ids){var set={};ids.forEach(function(i){set[i]=1});mutate(function(){var out=[];R().tasks.forEach(function(t){out.push(t);if(set[t.id]){var c=clone(t);c.id=uid();out.push(c)}});R().tasks=out;sel={}},'Duplicated '+ids.length+'.')}
function delTasks(ids){if(!ids.length)return;confirmBox('Delete '+ids.length+' task'+(ids.length>1?'s':'')+'?','They will be removed from the routine along with their ticks. You can tap Undo right afterwards.','Delete',true).then(function(ok){if(!ok)return;var set={};ids.forEach(function(i){set[i]=1});mutate(function(){R().tasks=R().tasks.filter(function(t){return!set[t.id]});ids.forEach(function(i){delete state.done[i]});sel={}},'Deleted.')})}
function nudge(id,dir){var list=viewTasks(selKey||today()),i=list.map(function(t){return t.id}).indexOf(id),o=list[i+dir];if(i<0||!o)return;mutate(function(){var T=R().tasks,a=T.indexOf(list[i]),b=T.indexOf(o),x=T[a];T[a]=T[b];T[b]=x})}
function dropOn(src,dst){mutate(function(){var T=R().tasks,a=T.filter(function(t){return t.id===src})[0],b=T.filter(function(t){return t.id===dst})[0];if(!a||!b)return;T.splice(T.indexOf(a),1);T.splice(T.indexOf(b),0,a);a.date=b.date})}
function dayDlg(date){
  var d=date&&dayOf(date),isNew=!d;
  modal(isNew?'Add date':'Day info',(isNew?'<label class="f" for="dd">Date</label><input id="dd" type="date" value="'+(date||today())+'">':'<label class="f" for="dd">Date (change it to move the whole day)</label><input id="dd" type="date" value="'+d.date+'">')+hm('dp',d&&d.planned,'Planned')+'<label class="f" for="dn">Note (for example Rest, or a subject focus)</label><input id="dn" maxlength="300" value="'+esc(d?d.note:'')+'">',[{label:'Cancel',cls:'ghost',val:0},{label:'Save',val:1,v:true}],function(q){var v=q('#dd').value;if(!v)return'Pick a date.';if((isNew||v!==date)&&dayOf(v))return'That date already exists. Use Copy day to combine days.';return''}).then(function(r){
    if(r.val!==1)return;var v=r.q('#dd').value,pl=rd(r.q,'dp'),nt=r.q('#dn').value.trim().slice(0,300);
    mutate(function(){if(isNew){R().days.push({date:v,planned:pl,note:nt});R().days.sort(byDate)}else{d.planned=pl;d.note=nt;if(v!==date){d.date=v;tasksOn(date).forEach(function(t){t.date=v});if(state.time[date]){state.time[v]=state.time[date];delete state.time[date]}R().days.sort(byDate)}}selKey=v},isNew?'Date added.':'Saved.')})}
function copyDlg(src){
  modal('Copy '+fmtShort(src)+' to another date','<label class="f" for="cd">Target date</label><input id="cd" type="date"><label class="sc wide"><input type="radio" name="cm" value="add" checked><span>Add to that day</span></label><label class="sc wide"><input type="radio" name="cm" value="rep"><span>Replace that day\'s routine</span></label><p class="sub">Copies start unticked.</p>',[{label:'Cancel',cls:'ghost',val:0},{label:'Copy',val:1,v:true}],function(q){var v=q('#cd').value;return!v?'Pick a target date.':v===src?'Pick a different date.':''}).then(function(r){
    if(r.val!==1)return;var dst=r.q('#cd').value,rep=r.q('input[name=cm]:checked').value==='rep',ex=tasksOn(dst).length,n=tasksOn(src).length;
    (rep&&ex?confirmBox('Replace '+fmtShort(dst)+'?',ex+' existing task'+(ex>1?'s':'')+' on that date will be deleted and replaced by '+n+' copied task'+(n===1?'':'s')+'. You can tap Undo afterwards.','Replace day',true):Promise.resolve(true)).then(function(ok){if(!ok)return;
      mutate(function(){ensureDay(dst);var sd=dayOf(src),dd=dayOf(dst);if(rep){tasksOn(dst).forEach(function(t){delete state.done[t.id]});R().tasks=R().tasks.filter(function(t){return t.date!==dst});dd.planned=sd?sd.planned:null;dd.note=sd?sd.note:''}else if(sd){if(dd.planned==null)dd.planned=sd.planned;if(!dd.note)dd.note=sd.note}tasksOn(src).forEach(function(t){var c=clone(t);c.id=uid();c.date=dst;R().tasks.push(c)});selKey=dst},'Copied to '+fmtShort(dst)+'.')})})}
function delDay(date){
  var n=tasksOn(date).length;
  modal('Delete '+fmtShort(date)+'?',n?'<p>This date has '+n+' task'+(n>1?'s':'')+'. Choose what happens to them.</p>':'<p>This date entry will be removed.</p>',n?[{label:'Cancel',cls:'ghost',val:0},{label:'Delete date, keep tasks in backlog',val:'keep'},{label:'Delete date and its tasks',cls:'danger',val:'del'}]:[{label:'Cancel',cls:'ghost',val:0},{label:'Delete date',cls:'danger',val:'del'}]).then(function(r){
    if(!r.val)return;mutate(function(){R().days=R().days.filter(function(d){return d.date!==date});if(r.val==='keep')tasksOn(date).forEach(function(t){t.date=null});else{tasksOn(date).forEach(function(t){delete state.done[t.id]});R().tasks=R().tasks.filter(function(t){return t.date!==date})}selKey='backlog';sel={}},'Date deleted.')})}
function restoreOrig(){confirmBox('Restore the original routine?','Your current routine, including all edits, is replaced by the originally supplied one. Study time, weak chapters, mistakes, and preferences are kept. Ticks stay on tasks that still exist in the original. You can tap Undo afterwards.','Restore routine',true).then(function(ok){if(ok){mutate(function(){state.routine=clone({days:DEF.days,tasks:DEF.tasks});state.routineVersion=DEF.version;sel={};selKey=''},'Original routine restored.')}})}
function addEarly(){var have={};R().days.forEach(function(d){have[d.date]=1});var nd=EARLY.days.filter(function(d){return!have[d.date]});
  if(!nd.length){toast('Those dates already exist in your routine.');return}
  confirmBox('Add the earlier Oct 26–Nov 11 plan?',nd.length+' dates will be added. Dates you already have are left untouched.','Add dates',false).then(function(ok){if(ok)mutate(function(){var set={};nd.forEach(function(d){set[d.date]=1;R().days.push(clone(d))});EARLY.tasks.forEach(function(t){if(set[t.date])R().tasks.push(clone(t))});R().days.sort(byDate)},'Earlier plan added.')})}
/* ---------- events ---------- */
document.addEventListener('change',function(e){
  var t=e.target,D=t.dataset||{};
  if(D.task){if(t.checked)state.done[D.task]=true;else delete state.done[D.task];save();render(true)}
  else if(D.sel){if(t.checked)sel[D.sel]=true;else delete sel[D.sel];render(true)}
  else if(D.weak){state.weak.forEach(function(w){if(w.id===D.weak)w.done=t.checked});save();render(true)}
  else if(D.time){var o=state.time[D.time]||{h:0,m:0};o[D.u]=Math.max(0,Math.min(D.u==='h'?24:59,parseInt(t.value,10)||0));if(o.h||o.m)state.time[D.time]=o;else delete state.time[D.time];save();render(true)}
  else if(D.pref==='fs'){if(FS[t.value]){state.prefs.fs=t.value;save();render(true)}}
  else if(D.th){var th=state.prefs.theme;var nt={name:'custom',accent:th.accent,bg:th.bg};nt[D.th]=t.value;state.prefs.theme=nt;save();render(true)}
  else if(D.jump&&t.value){selKey=t.value;render()}
  else if(t.id==='file'&&t.files[0])doImport(t.files[0])});
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.dataset.bi!==undefined)return;var D=b.dataset;
  if(D.tab)return go(D.tab);
  if(D.delweak){state.weak=state.weak.filter(function(w){return w.id!==D.delweak});save();return render(true)}
  if(D.delmis)return confirmBox('Delete this mistake?','It will be removed from the log.','Delete',true).then(function(ok){if(ok){state.mistakes=state.mistakes.filter(function(m){return m.id!==D.delmis});save();render(true)}});
  var id=D.id;
  switch(D.act){
    case'pick':selKey=D.k;render();break;
    case'shift':selKey=addDays(curDate(),+D.n);render();break;
    case'hshift':followToday=false;hd=addDays(hd||today(),+D.n);render();break;
    case'htoday':followToday=true;render();break;
    case'gooverdue':selKey='overdue';edit=true;go('routine');break;
    case'toggleedit':edit=!edit;sel={};render(true);break;
    case'undo':undo();break;
    case'addtask':taskForm(null,DRE.test(selKey)?selKey:(selKey==='overdue'?today():null));break;
    case'edittask':taskForm(R().tasks.filter(function(t){return t.id===id})[0]);break;
    case'up':nudge(id,-1);break;case'dn':nudge(id,1);break;
    case'dayinfo':dayDlg(curDate());break;
    case'adddate':dayDlg(null);break;
    case'copyday':copyDlg(curDate());break;
    case'delday':delDay(curDate());break;
    case'selall':viewTasks(selKey||today()).forEach(function(t){sel[t.id]=true});render(true);break;
    case'selinc':viewTasks(selKey||today()).forEach(function(t){if(!isDone(t))sel[t.id]=true});render(true);break;
    case'clrsel':sel={};render(true);break;
    case'movesel':moveDlg(selIds());break;
    case'dupsel':dupTasks(selIds());break;
    case'delsel':delTasks(selIds());break;
    case'addweak':var c=document.getElementById('wc').value.trim();if(!c){toast('Enter a chapter or lesson first.');break}state.weak.push({id:uid(),subject:document.getElementById('ws').value,chapter:c,note:document.getElementById('wn').value.trim(),done:false});save();render(true);toast('Weak chapter added.');break;
    case'addmistake':var w=document.getElementById('mw').value.trim();if(!w){toast('Describe what went wrong first.');break}state.mistakes.push({id:uid(),date:today(),subject:document.getElementById('ms').value,chapter:document.getElementById('mc').value.trim(),what:w,fix:document.getElementById('mf').value.trim()});save();render(true);toast('Mistake added.');break;
    case'export':doExport();break;
    case'import':document.getElementById('file').click();break;
    case'restoreorig':restoreOrig();break;
    case'addearly':addEarly();break;
    case'lang':if(D.v==='bn'||D.v==='en'){state.prefs.lang=D.v;save();render(true)}break;
    case'theme':var P=THEMES[D.p];state.prefs.theme={name:D.p,accent:P[1],bg:P[2]};save();render(true);break;
    case'savelimit':var l=(parseInt(document.getElementById('lh').value,10)||0)*60+(parseInt(document.getElementById('lm').value,10)||0);if(l<60||l>1440){toast('Enter a limit between 1h and 24h.');break}state.prefs.limit=l;save();render(true);toast('Daily limit saved.');break;
    case'install':if(deferred){deferred.prompt();deferred.userChoice.finally(function(){deferred=null;render(true)})}break;
    case'resetprog':confirmBox('Reset study records?','This clears all ticks, study time, weak chapters, and mistakes on this phone. Your routine is kept. This cannot be undone.','Reset progress',true).then(function(ok){if(ok){state.done={};state.time={};state.weak=[];state.mistakes=[];undoStack=[];save();render();toast('Progress reset.')}});break;
    case'doupdate':updating=true;if(updWorker)updWorker.postMessage({type:'SKIP_WAITING'});break;
    case'later':var u=document.getElementById('upbar');if(u)u.remove();break}});
document.addEventListener('toggle',function(e){var a=e.target.dataset&&e.target.dataset.acc;if(a)openAcc[a]=e.target.open},true);
document.addEventListener('dragstart',function(e){var r=e.target.closest&&e.target.closest('[data-drag]');if(r){dragId=r.dataset.drag;try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(_){}}});
document.addEventListener('dragover',function(e){if(dragId&&e.target.closest&&e.target.closest('[data-drag]'))e.preventDefault()});
document.addEventListener('drop',function(e){var r=e.target.closest&&e.target.closest('[data-drag]');if(dragId&&r&&r.dataset.drag!==dragId){e.preventDefault();dropOn(dragId,r.dataset.drag)}dragId=null});
function doExport(){try{var blob=new Blob([JSON.stringify(Object.assign({exported:new Date().toISOString(),appVersion:APP_VERSION},state),null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ssc2027-backup-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);toast('Backup exported. Check your Downloads folder.')}catch(e){toast('Export failed: '+e.message)}}
function doImport(f){
  var r=new FileReader();r.onerror=function(){toast('Could not read that file.')};
  r.onload=function(){var ns;try{ns=clean(JSON.parse(r.result))}catch(e){toast('Import failed: '+(e instanceof SyntaxError?'the file is not valid JSON.':e.message));document.getElementById('file').value='';return}
    var old=!!ns.migratedV1;
    confirmBox('Replace current data?',old?'This is a backup from the earlier app version. Only study time, weak chapters, and mistakes will be imported. Your current routine and ticks stay.':'This backup has '+ns.routine.tasks.length+' tasks, '+ns.routine.days.length+' dates, '+ns.weak.length+' weak chapters, and '+ns.mistakes.length+' mistakes. Everything on this phone, including your routine, will be replaced.','Import backup',true).then(function(ok){
      if(ok){if(old){state.time=ns.time;state.weak=ns.weak;state.mistakes=ns.mistakes}else{state=ns}undoStack=[];sel={};save();render();toast('Backup imported.')}else document.getElementById('file').value=''})};
  r.readAsText(f)}
/* ---------- updates, offline, install ---------- */
var updWorker=null;
function showUpdate(w){updWorker=w;if(document.getElementById('upbar'))return;var d=document.createElement('div');d.id='upbar';d.className='upd';d.setAttribute('role','status');d.innerHTML='<span>A new version is ready. Your data stays on this phone.</span><button class="sm" data-act="doupdate">Update now</button><button class="ghost sm" data-act="later">Later</button>';document.body.appendChild(d)}
function setupSW(){
  if(!('serviceWorker' in navigator))return;
  navigator.serviceWorker.register('sw.js').then(function(reg){
    if(reg.waiting&&navigator.serviceWorker.controller)showUpdate(reg.waiting);
    reg.addEventListener('updatefound',function(){var nw=reg.installing;if(nw)nw.addEventListener('statechange',function(){if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdate(nw)})});
    var chk=function(){reg.update().catch(function(){})};window.addEventListener('online',chk);document.addEventListener('visibilitychange',function(){if(!document.hidden)chk()});chk();
  }).catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(updating){save();location.reload()}else if(tab==='more')render(true)})}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;if(tab==='more')render(true)});
window.addEventListener('appinstalled',function(){deferred=null;toast('Installed.')});
function net(){var n=document.getElementById('net');if(n)n.textContent=navigator.onLine?'Online':'Offline'}
window.addEventListener('online',net);window.addEventListener('offline',net);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&(tab==='home'||followToday))render(true)});
/* ---------- start ---------- */
if(!DEF||!EARLY){document.getElementById('view').innerHTML='<section class="card"><h2>App file missing</h2><p>routine-default.js did not load. Check that it is uploaded next to index.html, then reload.</p></section>'}
else{load();render();setupSW();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(function(ok){persisted=ok?'Storage is marked persistent.':'';})}catch(e){}}
</script>
